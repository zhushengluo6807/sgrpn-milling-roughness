    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #20262e" transform="translate(767.56989 296.810008)">One-shot prediction</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #20262e" transform="translate(719.138953 307.986008)">Frozen μ̂ and σ for every outer-test region</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #20262e" transform="translate(877.059461 401.956143)">Apply q₁₋α</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #20262e" transform="translate(851.537609 412.331143)">intervals for all regions</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #20262e" transform="translate(859.970539 422.706143)">and three readings</text>
   </g>
   <g id="text_19">
