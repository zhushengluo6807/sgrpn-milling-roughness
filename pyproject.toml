[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roughness-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[project.scripts]
roughness-first-round = "roughness.cli:main"
roughness-scheme1 = "roughness.scheme1.cli:main"
roughness-scheme1-physics = "roughness.scheme1_physics.cli:main"
roughness-sgrpn = "roughness.sgrpn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
